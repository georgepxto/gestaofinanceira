<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hedge-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" />
    <link rel="apple-touch-icon" href="/favicon-app.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="Hedge - Suas contas na régua. Gestão financeira pessoal simplificada."
    />
    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hedge" />
    <meta property="og:title" content="Hedge — Seu dinheiro deixa pistas." />
    <meta property="og:description" content="Entenda para onde seu dinheiro vai, identifique padrões e construa hábitos que fazem diferença. Gratuito, seguro e sem anúncios." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/favicon-light.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hedge — Seu dinheiro deixa pistas." />
    <meta name="twitter:description" content="Entenda para onde seu dinheiro vai, identifique padrões e construa hábitos que fazem diferença. Gratuito, seguro e sem anúncios." />
    <!-- Fontes sem bloquear a primeira pintura: o CSS entra como preload e vira
         stylesheet quando chega; até lá o texto aparece na fonte do sistema
         (display=swap). Duas famílias e só duas: Switzer (variável, para o
         450 dos títulos) em todo texto e Geist Mono nos números — esta vem de
         /fonts (ver src/index.css), por causa do zero sem traço. -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <!-- Os arquivos do primeiro quadro vêm em paralelo com o CSS, não depois
         dele. Se o Fontshare trocar o arquivo, o preload só fica sem uso. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.fontshare.com/wf/HJHZ26OECMTXRH7JXPFC7EVIHDSLT2RA/LJRNLR7WCPF3PY3SZ7B2LHNUTQMFNCHL/4MCJYGQDIOOXHWSIIB2OYNDBEALJSOGN.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/geist-mono-400.woff2">
    <link rel="preload" as="style" href="https://api.fontshare.com/v2/css?f[]=switzer@1&display=swap" onload="this.onload=null;this.rel='stylesheet';window.__hedgeFontCss&&window.__hedgeFontCss()">
    <!-- Fontes prontas: a entrada do hero (e do login) espera a Switzer para
         o título não aparecer na fonte do sistema e trocar na frente de
         quem lê. Limite de 900 ms: sem a fonte até lá, entra assim mesmo. -->
    <script>
      (function () {
        var html = document.documentElement, done = false, css = 0;
        function ready() { if (!done) { done = true; html.classList.add("fonts-ready"); } }
        window.__hedgeFontCss = function () {
          if (++css < 1) return;
          try {
            Promise.all([
              document.fonts.load('400 1em "Switzer"'),
              document.fonts.load('500 1em "Switzer"'),
              document.fonts.load('400 1em "Geist Mono"')
            ]).then(ready, ready);
          } catch (e) { ready(); }
        };
        setTimeout(ready, 900);
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@1&display=swap">
    </noscript>
    <title>Hedge</title>
    <!-- Tema antes do primeiro paint. Sem isto, quem está no claro vê um
         flash escuro a cada carregamento: o useEffect que tira o .dark só
         roda depois de o browser já ter pintado. O escuro é o padrão de quem
         nunca escolheu. A mesma regra está em src/hooks/useTheme.tsx — se ela
         mudar lá, muda aqui. -->
    <script>
      (function () {
        var html = document.documentElement, t = null, sessao = true;
        try {
          t = localStorage.getItem("theme");
          sessao = Object.keys(localStorage).some(function (k) {
            return k.indexOf("sb-") === 0 && k.slice(-11) === "-auth-token";
          });
        } catch (e) {}
        // Landing e login são sempre escuros, qualquer que seja o tema do app:
        // sem sessão, "/" e "/login" pintam o fundo deles antes do React.
        var p = location.pathname;
        var marca = !sessao && (p === "/" || p === "/login");
        var escuro = t !== "light";
        if (escuro) html.classList.add("dark");
        if (marca) html.style.backgroundColor = "#0B0B0C";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", escuro || marca ? "#0B0B0C" : "#ECECE9");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
