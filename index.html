<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#FAFAFA" />
    <meta
      name="description"
      content="Hedge - Suas contas na régua. Gestão financeira pessoal simplificada."
    />
    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hedge" />
    <meta property="og:title" content="Hedge — Seu dinheiro deixa pistas. Nós revelamos o caminho." />
    <meta property="og:description" content="Entenda para onde seu dinheiro vai, identifique padrões e construa hábitos que fazem diferença. Gratuito, seguro e sem anúncios." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/favicon-light.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hedge — Seu dinheiro deixa pistas. Nós revelamos o caminho." />
    <meta name="twitter:description" content="Entenda para onde seu dinheiro vai, identifique padrões e construa hábitos que fazem diferença. Gratuito, seguro e sem anúncios." />
    <!-- Syne — display / headings · Geist — números grandes · Geist Mono — números/dados -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Geist:wght@600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Switzer — body / UI -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
    <!-- Geist Mono — números / mono -->
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Hedge</title>
    <!-- Tema antes do primeiro paint. Sem isto, quem está no escuro vê um
         flash branco a cada carregamento: o useEffect que aplica .dark só
         roda depois de o browser já ter pintado o fundo claro do index.css.
         A lógica de migração é a mesma de src/hooks/useTheme.tsx — se ela
         mudar lá, muda aqui. -->
    <script>
      (function () {
        try {
          var MIGRATION_KEY = "theme-migrated-light-v1";
          var t = localStorage.getItem("theme");
          if (t === "dark" && !localStorage.getItem(MIGRATION_KEY)) {
            localStorage.setItem(MIGRATION_KEY, "1");
            localStorage.setItem("theme", "light");
            t = "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0A0A0B");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
