name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    # A conta só de teste. Sem estes segredos cadastrados no repositório, o
    # passo "Telas logadas" é pulado e o resto roda igual.
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      # Antes do build: uma violação de sistema visual aparece em segundos,
      # sem esperar o bundle.
      - name: Sistema visual
        run: bash scripts/check-design-system.sh

      - name: Lint
        run: npm run lint

      - name: Testes das regras de dinheiro
        run: npm test

      - name: Build
        run: npm run build

      # Landing e login num navegador de verdade. Não entram em conta nenhuma,
      # então o Supabase daqui é de mentira: só precisa existir para o app abrir.
      - name: Navegador dos testes de tela
        run: npx playwright install --with-deps chromium

      - name: Telas públicas
        run: npx playwright test tests/e2e/public-visual.spec.ts
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-teste

      # Entra na conta de teste e lança, edita, divide e exclui gastos. Tudo o
      # que cria se chama "[TESTE] ..." e é apagado no fim.
      - name: Telas logadas
        if: ${{ env.E2E_EMAIL != '' }}
        run: npx playwright test tests/e2e/logado.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
