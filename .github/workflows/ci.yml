name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      # Antes do build: uma violação de sistema visual aparece em segundos,
      # sem esperar o bundle.
      - name: Sistema visual
        run: bash scripts/check-design-system.sh

      - name: Build
        run: npm run build
